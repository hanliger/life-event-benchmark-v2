# RQ1 occurred-pair no-prospective ladder — standing run configuration.
#
# Consumed by scripts/run_rq1_pair_ladder.py, which refuses to start if any
# setting here cannot be applied by the client (see `unsupported` handling in
# that script). Nothing in this file is advisory: a knob that the provider
# would silently ignore is an error, not a default.
#
# Protocol and its limitations: docs/rq1_pair_protocol.md
protocol_version: rq1-occurred-event-pairs-temp-v1
condition: no_prospective_substituted

checkpoints: [60, 120, 180, 240, 300]

items: data/runs/rq1_smoke/rq1/natural/progressive_items.jsonl
taxonomy: data/runs/rq1_smoke/rq1/taxonomy.json
# must be the substituted corpus; the evaluator verifies this and refuses
# otherwise, so pointing it at the original corpus cannot silently produce a
# full_prefix run wearing the ablation's name
sessions_dir: data/runs/hf_full/no_prospective/final_sessions
original_sessions_dir: data/runs/hf_full/final_sessions
# prompt/taxonomy hashes the ablation audit must match, written by
# scripts/audit_rq1_pair_protocol.py
protocol_manifest: data/runs/rq1_smoke/rq1_pair_temp/protocol_manifest.json
trajectory_id: traj_001
output_root: data/runs/rq1_smoke/rq1_pair_temp/no_prospective_substituted_low

# Applies to every model unless a model block overrides it.
common:
  max_output_tokens: 20000
  timeout_seconds: 600
  automatic_retries: 0

models:
  claude_opus_4_8:
    provider: anthropic
    # Opus 5 sat far enough from the other two that the comparison read as a
    # generation gap rather than a benchmark result; 4.8 is the closer peer.
    model: claude-opus-4-8
    thinking_type: adaptive
    effort: low
    # thinking_display: omitted — the API never returns thinking text to this
    # client (only the token count, and Opus 5 does not even report that), so
    # there is nothing to display or suppress. Recorded as not-applicable
    # rather than silently accepted.
    thinking_display: omitted

  gemini_3_1_pro:
    provider: gemini
    model: gemini-3.1-pro-preview
    thinking_level: low
    include_thoughts: false
    # null = send no temperature at all, so Gemini samples at its provider
    # default. Gemini is the only model of the three that actually receives the
    # parameter, so pinning it to a number made it the odd one out: Opus and
    # gpt-5.6-sol both drop it and sample at their own defaults regardless.
    temperature: null

  gpt_5_6_sol:
    provider: openai
    model: gpt-5.6-sol
    reasoning_effort: low
    text_verbosity: medium
    store: false
    truncation: disabled
    # reasoning_mode / reasoning_context / reasoning_summary are Responses-API
    # concepts. This client uses chat.completions, where `standard`,
    # `current_turn` and a null summary are exactly the default behaviour, so
    # these are recorded as satisfied-by-default rather than sent.
    reasoning_mode: standard
    reasoning_context: current_turn
    reasoning_summary: null
