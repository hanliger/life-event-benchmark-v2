# Dialogue generation knobs.
turns_min: 8
turns_max: 8
user_turns_min: 4
user_turns_max: 4
target_sessions_per_trajectory: 300
routine_sessions_per_year: 2     # fallback when target_sessions_per_trajectory is unset
hard_negative_ratio: 0.25        # fallback: hard-negative plans per evidence plan
cues_per_session: [1, 3]

controlled_window_size: 15

task_selection:
  require_event_specific_template: true
  generic_fallback_for_evidence: false
  penalize_repeated_task: true

evidence:
  # An occurred event must be recoverable from its one occurred anchor.  Do
  # not turn lifecycle stages into an accidental multi-hop requirement.
  drift_event_ratio: 0.0
  require_occurred_financial_consequence: true
  prevent_cross_status_cue_reuse: true
  require_memory_fact_for_session_updates: true

semantic_validity:
  prohibit_direct_event_disclosure: true
  min_occurred_evidence_dimensions: 2
  require_subtype_disambiguation: true
  allow_event_evidence_after_opening: true
  evidence_deadline_user_turn: 3

surface_diversity:
  exact_opening_max_count: 2
  exact_lifecycle_phrase_max_ratio: 0.15
  lifecycle_phrase_family_max_ratio: 0.40
  evidence_placement_max_ratio: 0.60
  hard_negative_template_max_ratio: 0.15
  min_placement_strategies_when_status_count_at_least: 3
  placement_strategy_status_count_threshold: 10

high_risk:
  require_execution_contract: true
  prohibit_completion_with_missing_slots: true
  require_explicit_confirmation: true
  allow_unplanned_concrete_values: false

bank_policy:
  profile_id: benchmark_neutral_bank
  prohibit_unsupported_claims: true

hard_negatives:
  target_ratio: 0.30
  balance_by_domain: true
  types:
    action_matched_hard_negative: 0.40
    existing_state_negative: 0.25
    sibling_event_negative: 0.20
    stale_value_no_change: 0.15

followups:
  consequence_ratio: 0.60
  stale_recall_ratio: 0.30
  consequence_delay_months: [1, 4]
  stale_delay_months: [2, 6]

controlled_layout:
  window_size: 15
  filler_month_strategy: balanced
  max_filler_sessions_per_month: 5

canary:
  trajectory_count: 1
  required_sessions: 300
  gates:
    final_success_rate_min: 0.98
    unrecovered_failure_count_max: 0
    repair_session_rate_max: 0.20
    event_label_leakage_max: 0
    internal_metadata_leakage_max: 0
    unsafe_high_risk_execution_max: 0
    memory_fact_mismatch_max: 0
    cancelled_commit_max: 0
    weak_signal_overcommit_max: 0
    hard_negative_update_max: 0
    missing_required_cue_rate_max: 0.02
    repeated_utterance_session_rate_max: 0.05
    near_duplicate_session_rate_max: 0.05
    offline_banking_violation_max: 0
    turn_contract_violation_max: 0
    task_not_introduced_in_opening_max: 0
    required_evidence_not_realized_max: 0
    evidence_revealed_too_late_max: 0
    evidence_placement_strategy_mismatch_max: 0
    direct_event_disclosure_max: 0
    high_risk_missing_required_slot_max: 0
    high_risk_false_completion_max: 0
    high_risk_missing_confirmation_max: 0
    high_risk_unplanned_slot_value_max: 0
    high_risk_action_resolution_mismatch_max: 0
    insufficient_event_evidence_max: 0
    subtype_not_disambiguated_max: 0
    unsupported_bank_policy_claim_max: 0
    bank_policy_contradiction_max: 0
    stale_old_current_confusion_max: 0
    duplicate_opening_over_limit_max: 0
    lifecycle_phrase_overconcentration_max: 0
    evidence_placement_overconcentration_max: 0
    event_strategy_overconcentration_max: 0
    hard_negative_template_overconcentration_max: 0
  warnings:
    repair_session_rate: 0.10
    filler_same_month_density: false
    task_template_overconcentration: true

regression_canary:
  repair_session_rate_max: 0.10
