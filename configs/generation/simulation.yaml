# Trajectory simulation knobs (heuristic; see life_events.yaml disclaimer).
horizon_years_default: 10
max_concurrent_active_events: 2
max_events_per_trajectory: 15
min_months_between_event_starts: 2
snapshot_every_transition: true
# Global multiplier applied to every hazard.
# Tuned to produce roughly 10 occurred events over a 10-year trajectory.
global_hazard_scale: 6.0
