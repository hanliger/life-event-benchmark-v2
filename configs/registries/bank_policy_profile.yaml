profile_id: benchmark_neutral_bank
rules:
  joint_account:
    allowed:
      - 공동 생활비 용도의 계좌 관리 방법을 안내할 수 있다
      - 대표 명의 또는 이용 방식의 가능 여부를 앱에서 확인할 수 있다
    prohibited_patterns:
      - 공동명의 계좌는 항상 가능
      - 두 명 이상 공동명의로 등록 가능
      - 공동명의 계좌는 만들 수 없
      - 공동명의는 절대 불가능
      - 반드시 한 명의 대표 명의
  fees:
    prohibited_patterns:
      - 수수료가 없
      - 수수료는 무료
      - 무조건 수수료 면제
      - 우대 수수료가 자동 적용
  account_opening:
    prohibited_patterns:
      - 누구나 개설 가능
      - 별도 조건 없이 개설
      - 서류 없이 바로 개설
fallback_instruction_ko: 정책 정보가 plan에 없으면 적용 가능한 선택지를 앱에서 확인할 수 있다고만 안내한다.
