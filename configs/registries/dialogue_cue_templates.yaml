# Lifecycle-specific semantic cues. Anchors keep the policy consistent while
# every referenced cue remains event/path specific.
_weak_defaults: &weak
  semantic_instruction_ko: "관련 생활 변화의 가능성을 암시하되 새 값이나 완료를 확정하지 않는다."
  allowed_statuses: [weak_signal]
  required_value_source: null
  exact_surface_required: false
  explicitness: implicit
  allow_reuse_across_statuses: false
  cue_role: event_signal
  surface_examples: ["아직 확정은 아니어서 조건만 미리 보고 있어요"]
_upcoming_defaults: &upcoming
  semantic_instruction_ko: "관련 금융 준비와 값이 미래에 적용될 예정임을 시간 표현과 함께 드러낸다."
  allowed_statuses: [upcoming]
  required_value_source: [event.params, session_memory_updates]
  exact_surface_required: false
  explicitness: recoverable
  allow_reuse_across_statuses: false
  cue_role: event_signal
  surface_examples: ["다음 달부터 쓸 예정이라 미리 준비하고 있어요"]
_occurred_defaults: &occurred
  semantic_instruction_ko: "관련 변화 뒤 실제 입금·이체·등록·납부 같은 금융 결과가 발생했음을 드러낸다."
  allowed_statuses: [occurred]
  required_value_source: [session_memory_updates, event.params]
  exact_surface_required: false
  explicitness: recoverable
  allow_reuse_across_statuses: false
  cue_role: event_signal
  surface_examples: ["이번에 실제로 반영돼 금융 설정을 정리하려고요"]
_cancelled_defaults: &cancelled
  semantic_instruction_ko: "이전의 예정 또는 pending 값을 언급하고 계획이 취소되어 현재가 되지 않았음을 드러낸다."
  allowed_statuses: [cancelled]
  required_value_source: [session_memory_updates, event.params]
  exact_surface_required: false
  explicitness: recoverable
  allow_reuse_across_statuses: false
  cue_role: cancellation
  surface_examples: ["지난번에 준비하던 건 취소돼서 기존 설정을 그대로 쓰려고요"]

