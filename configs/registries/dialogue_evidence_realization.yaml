# Every active event/status appears below. An empty status mapping inherits
# these lifecycle defaults; event-specific mappings override only the fields
# that need subtype or evidence-strength calibration.
_defaults:
  weak_signal:
    min_distinct_dimensions: 2
    required_roles: [uncertainty, financial_consequence]
    allowed_dimensions:
      - dimension_id: possible_state_change
        role: uncertainty
        semantic_instruction_ko: 현재 상태가 바뀔 가능성만 간접적으로 드러내고 확정된 변화로 말하지 않는다.
      - dimension_id: possible_financial_adjustment
        role: financial_consequence
        semantic_instruction_ko: 변화가 생길 경우 기존 입금·납부·저축 설정을 조정할 수 있음을 드러낸다.
    placement_strategies: [task_and_evidence_opening, task_first_evidence_turn_2, task_first_evidence_turn_3, task_first_evidence_split_turns_2_3]
    surface_families: [uncertain_continuation, hypothetical_preparation, preliminary_eligibility, possible_change_concern, compare_before_deciding]
  upcoming:
    min_distinct_dimensions: 2
    required_roles: [future_timing, financial_consequence]
    allowed_dimensions:
      - dimension_id: pending_state_timing
        role: future_timing
        semantic_instruction_ko: 새 상태가 미래에 효력을 갖고 현재 상태와는 다름을 드러낸다.
      - dimension_id: scheduled_financial_adjustment
        role: financial_consequence
        semantic_instruction_ko: 효력 시점에 맞춰 입금·납부·저축 설정을 준비해야 함을 드러낸다.
    placement_strategies: [task_and_evidence_opening, task_first_evidence_turn_2, task_first_evidence_turn_3, task_first_evidence_split_turns_2_3]
    surface_families: [known_effective_date, submitted_not_effective, future_payment_or_registration, milestone_activation, current_pending_contrast]
  occurred:
    min_distinct_dimensions: 2
    required_roles: [state_change, financial_consequence]
    allowed_dimensions:
      - dimension_id: current_state_changed
        role: state_change
        semantic_instruction_ko: 은행 업무와 연결된 현재 등록 상태가 과거와 달라졌음을 사건명 없이 드러낸다.
      - dimension_id: observed_financial_consequence
        role: financial_consequence
        semantic_instruction_ko: 새 상태 때문에 실제 입금·납부·이체·저축 결과가 이미 달라졌음을 드러낸다.
    placement_strategies: [task_and_evidence_opening, task_first_evidence_turn_2, task_first_evidence_turn_3, task_first_evidence_split_turns_2_3]
    surface_families: [bank_consequence_observed, current_record_changed, old_action_no_longer_fits, first_transaction_new_state, current_historical_contrast]
  cancelled:
    min_distinct_dimensions: 2
    required_roles: [cancellation, prior_current_contrast]
    allowed_dimensions:
      - dimension_id: pending_change_withdrawn
        role: cancellation
        semantic_instruction_ko: 준비하던 변경을 철회했음을 사건명이나 상투적인 취소 문구 없이 드러낸다.
      - dimension_id: current_value_retained
        role: prior_current_contrast
        semantic_instruction_ko: 예정 값은 효력을 갖지 않고 현재 계좌·납부처·설정이 유지됨을 드러낸다.
    placement_strategies: [task_and_evidence_opening, task_first_evidence_turn_2, task_first_evidence_turn_3, task_first_evidence_split_turns_2_3, final_user_turn_reveal]
    surface_families: [pending_request_withdrawn, effective_date_removed, payee_or_account_unchanged, prepared_transfer_unneeded, pending_value_cleared]

