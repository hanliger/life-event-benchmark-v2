        expected_decision: ask_confirmation
        risk: high
      - selector: {label: loan_repayment}
        impact_type: new_repayment_schedule_needed
        expected_decision: ask_confirmation
        risk: high

career_job_change:
  on_occurred:
    action_impacts:
      - selector: {linked_memory_path: employment.salary_day}
        impact_type: trigger_day_may_be_stale
        expected_decision: ask_confirmation
        risk: high

career_resignation_or_job_loss:
  on_occurred:
    action_impacts:
      - selector: {linked_memory_path: employment.salary_day}
        impact_type: trigger_source_disappeared
        expected_decision: ask_confirmation
        risk: high
      - selector: {label: pension_contribution}
        impact_type: contribution_affordability_changed
        expected_decision: ask_confirmation
        risk: high

