# Event -> standing-action impact templates, keyed by event_id then lifecycle
# hook. Each impact:
#   selector:            {label: <action_type>} or {linked_memory_path: <path>}
#   impact_type:         free-form slug describing why the action may be wrong
#   expected_decision:   keep|ask_confirmation|pause|cancel|update
#   risk:                low|high (high + funds_movement => must_not_execute)
#
# Policy enforced by the impact engine:
#   - impacts on funds-moving actions never auto-execute; gold decision is
#     ask_confirmation (or pause/cancel *after* confirmation).
#   - weak_signal produces no impacts unless declared (usually none).

relationship_marriage:
  on_occurred:
    action_impacts:
      - selector: {label: salary_linked_savings}
        impact_type: goal_and_amount_may_change
        expected_decision: ask_confirmation
        risk: high

relationship_divorce_or_separation:
  on_occurred:
    action_impacts:
      - selector: {label: spouse_living_expense_transfer}
        impact_type: may_need_cancel_or_update
        expected_decision: ask_confirmation
        risk: high
      - selector: {label: child_support_transfer}
        impact_type: destination_or_amount_may_be_stale
        expected_decision: ask_confirmation
        risk: high

relationship_childbirth_or_adoption:
  on_occurred:
    action_impacts:
      - selector: {label: salary_linked_savings}
        impact_type: amount_reallocation_may_be_needed
        expected_decision: ask_confirmation
        risk: high

relationship_dependent_change:
  on_occurred:
    action_impacts:
      - selector: {label: parent_support_transfer}
        impact_type: amount_or_destination_may_change
        expected_decision: ask_confirmation
        risk: high

relationship_family_death:
  on_occurred:
    action_impacts:
      - selector: {label: parent_support_transfer}
        impact_type: destination_may_no_longer_exist
        expected_decision: ask_confirmation
        risk: high
        when: {deceased_relation: parent}
      - selector: {label: spouse_living_expense_transfer}
        impact_type: destination_may_no_longer_exist
        expected_decision: ask_confirmation
        risk: high
        when: {deceased_relation: spouse}
      - selector: {label: child_education_saving}
        impact_type: beneficiary_may_no_longer_exist
        expected_decision: ask_confirmation
        risk: high
        when: {deceased_relation: child}

housing_move:
  on_occurred:
    action_impacts:
      - selector: {label: rent_autopay}
        impact_type: destination_or_amount_may_be_stale
        expected_decision: ask_confirmation
        risk: high

housing_rental_contract:
  on_occurred:
