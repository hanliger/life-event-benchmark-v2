# Event -> financial-memory delta templates, keyed by event_id then lifecycle
# hook (on_weak_signal / on_upcoming / on_occurred / on_cancelled).
#
# Each memory update item:
#   path:        memory cell path (see financial_memory_schema.yaml)
#   operation:   create|update|mark_stale|archive|
#                set_pending|clear_pending|reactivate|no_update
#   value_from:  "param:<name>"  -> value from EventInstance.params
#                "literal:<v>"   -> literal value
#                (omitted for status-only operations)
#   optional:    if true, the delta engine may skip it (sampled)
#
# Lifecycle policy (enforced by the delta engine regardless of what is
# declared here):
#   weak_signal -> only set_pending, all optional
#   upcoming    -> only set_pending
#   occurred    -> update / mark_stale / archive / create / reactivate
#   cancelled   -> only clear_pending / no_update

relationship_marriage:
  on_weak_signal:
    memory_updates: []
    pending_memory:
      - path: household.marital_status
        operation: set_pending
        value_from: "literal:married"
        optional: true
  on_upcoming:
    memory_updates:
      - path: household.marital_status
        operation: set_pending
        value_from: "literal:married"
      - path: household.spouse_or_partner
        operation: set_pending
        value_from: "param:partner_ref"
  on_occurred:
    memory_updates:
      - path: household.marital_status
        operation: update
        value_from: "literal:married"
      - path: household.spouse_or_partner
        operation: update
        value_from: "param:partner_ref"
  on_cancelled:
    memory_updates:
      - path: household.marital_status
        operation: clear_pending
      - path: household.spouse_or_partner
        operation: clear_pending

relationship_divorce_or_separation:
  on_weak_signal:
    memory_updates: []
    pending_memory:
      - path: household.child_support_arrangement
        operation: set_pending
        value_from: "param:child_support_amount"
        when: {has_child_support: true}
        optional: true
  on_upcoming:
    memory_updates:
      - path: household.marital_status
        operation: set_pending
        value_from: "param:marital_status_after"
  on_occurred:
    memory_updates:
      - path: household.marital_status
        operation: update
        value_from: "param:marital_status_after"
      - path: household.spouse_or_partner
        operation: archive
      - path: household.child_support_arrangement
        operation: update
        value_from: "param:child_support_amount"
        when: {has_child_support: true}
      - path: household.child_support_arrangement
        operation: set_not_applicable
        when: {has_child_support: false}
  on_cancelled:
    memory_updates:
      - path: household.marital_status
        operation: clear_pending
      - path: household.child_support_arrangement
        operation: clear_pending

relationship_childbirth_or_adoption:
  on_weak_signal:
