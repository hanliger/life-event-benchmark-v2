  on_upcoming:
    memory_updates: []
  on_occurred:
    memory_updates:
      - path: household.dependents
        operation: update
        value_from: "param:dependents_after"
        when: {was_dependent: true}
      - path: household.marital_status
        operation: update
        value_from: "literal:widowed"
        when: {deceased_relation: spouse}
      - path: household.spouse_or_partner
        operation: set_not_applicable
        when: {deceased_relation: spouse}
      - path: household.children
        operation: update
        value_from: "param:children_after"
        when: {deceased_relation: child}
      - path: cashflow.recent_one_off_expense
        operation: update
        value_from: "param:one_off_expense"
  on_cancelled:
    memory_updates: []

