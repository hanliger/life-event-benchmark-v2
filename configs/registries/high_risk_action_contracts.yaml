# Each FA family covers more than one act. Setting up a recurring transfer needs
# a payee and an amount; cancelling one needs neither -- only which arrangement,
# and the customer's confirmation. Checking a limit executes nothing at all.
# Without these subtypes every act inherits the setup contract, so cancellation
# and lookup sessions get marked pending_required_information for slots the
# conversation never needed. `task_subtypes` below assigns them.
FA-07:
  default_subtype: transfer
  subtypes:
    transfer:
      required_for_execution: [source_account, destination_name, destination_account, amount, currency, execution_date, explicit_confirmation]
      optional: [fee_acknowledgement, exchange_rate_acknowledgement]
    inquiry:
      information_only: true
      required_for_execution: []
      optional: []
FA-08:
  default_subtype: recurring_transfer
  subtypes:
    recurring_transfer:
      required_for_execution: [source_account, destination_name, destination_account, amount, recurrence_day, explicit_confirmation]
      optional: [target_action_ids]
    cancel:
      required_for_execution: [target_action_ids, explicit_confirmation]
      optional: [source_account]
    # Cancelling a *reservation* -- a change that was scheduled but never
    # created -- has no arrangement to identify, so confirmation is all there is.
    cancel_reservation:
      required_for_execution: [explicit_confirmation]
      optional: []
    inquiry:
      information_only: true
      required_for_execution: []
      optional: []
FA-09:
  default_subtype: recurring_savings
  subtypes:
    recurring_savings:
      required_for_execution: [source_account, product_or_goal, amount, recurrence_day, explicit_confirmation]
      optional: []
    cancel:
      required_for_execution: [target_action_ids, explicit_confirmation]
      optional: [source_account]
    inquiry:
      information_only: true
      required_for_execution: []
      optional: []
FA-10:
  default_subtype: repayment
  subtypes:
    repayment:
      required_for_execution: [loan_reference, source_account, amount_or_schedule, execution_date_or_recurrence, explicit_confirmation]
      optional: []
    inquiry:
      information_only: true
      required_for_execution: []
      optional: []

# Declared per task template, because the act cannot be read off the task string.
# "주담대 실행과 상환계좌 확인" ends in 확인 yet really executes, while "주거 변경
# 비용 이체 한도 확인" is a pure lookup whose noun "주거 변경" makes any substring
# test for 변경 fire. Templates absent here fall back to the default subtype.
task_subtypes:
  # "예정했던 …만 취소하고 기존 설정을 유지한다" -- the change was scheduled but
  # never created, so there is no arrangement to point at.
  housing_move_jeonse_payment_cancel: cancel_reservation
  housing_move_other_payment_cancel: cancel_reservation
  housing_move_family_contribution_cancel: cancel_reservation
  # "기존 지원 이체를 … 해지한다" -- stopping an arrangement that already exists,
  # so which one must be identified.
  dependent_end_transfer_stop: cancel
  # "이체 한도만 확인한다" -- executes nothing.
  housing_move_other_transfer_limit: inquiry
  # The no-transfer sibling of dependent_end_transfer_stop: the event happened,
  # but with no arrangement to stop the session can only review the registration.
  dependent_end_registration_review: inquiry

slot_aliases:
  source_account: [source_account, withdrawal_account, from_account, salary_account]
  destination_name: [destination_name, recipient_name, payee_name, recipient, payee]
  destination_account: [destination_account, recipient_account, payee_account, to_account]
  # Every money-carrying life-event param must appear here, otherwise the `amount`
  # slot can never resolve from event.params and the planner falls through to the
  # persona's pre-existing standing-action amount -- stamping one constant onto
  # every session of a trajectory. Each event carries at most one of these, so
  # alias order cannot pick the wrong one.
  amount: [amount, amount_krw, transfer_amount, savings_amount, payment_amount,
           joint_living_expense_amount, new_rent_amount, monthly_edu_cost,
           support_amount, child_support_amount, one_off_cost, mortgage_monthly]
  currency: [currency, currency_code, target_currency]
  execution_date: [execution_date, transfer_date, payment_date]
  recurrence_day: [recurrence_day, transfer_day, payment_day, salary_day]
  product_or_goal: [product_or_goal, product_id, goal_id, savings_goal]
  loan_reference: [loan_reference, loan_id, mortgage_id]
  amount_or_schedule: [amount_or_schedule, amount, amount_krw, repayment_amount,
                       repayment_schedule, mortgage_monthly, one_off_cost]
  execution_date_or_recurrence: [execution_date_or_recurrence, execution_date, repayment_date, recurrence_day]
  target_action_ids: [target_action_ids]
