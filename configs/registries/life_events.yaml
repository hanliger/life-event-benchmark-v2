# Life event registry — 24 active events.
#
# This registry uses concrete event identities. Cause, target, and lifecycle
# stage that do not require separate memory transitions are stored as event
# parameters rather than additional top-level event IDs.
#
# IMPORTANT: base_rate_per_year / modifiers / lifecycle durations are NOT
# empirical transition probabilities. They are plausibility constraints and
# heuristic sampling weights used to produce diverse, state-consistent
# trajectories. Do not cite them as population statistics.
#
# Guards reference LifeState fields (see src/fin_life_benchmark/trajectory/models.py).
# lifecycle: months are [min,max] ranges; p_skip_*: probability the stage is
# skipped (sudden events skip weak_signal/upcoming entirely).
# life_generator_node_ids: cross-reference into the reused life_generator
# event-id namespace (see docs/repo_inventory.md).
#
# Follow-up work is required in event_lifecycle.py, episode_bridge.py,
# event_to_memory_delta.yaml, and event_to_action_impact.yaml before the new
# IDs and parameter schemas can be used for full trajectory generation.

