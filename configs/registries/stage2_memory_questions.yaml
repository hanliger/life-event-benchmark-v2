version: 1
checkpoint_stride: 15

# MCQ choices are used only for closed, semantic value domains. Generated
# entities, amounts, counts, addresses, and lists remain free-response.
choice_sets:
  marital_status:
    single: 미혼
    married: 기혼
    separated: 별거
    divorced: 이혼
    widowed: 사별
  employment_status:
    employed: 재직
    self_employed: 자영업
    unemployed: 무직
    on_leave: 휴직
    retired: 은퇴
    student: 학생
    homemaker: 가사 종사
  income_stability:
    stable: 안정적
    variable: 변동적
    reduced: 감소
    unstable: 불안정
    retired: 은퇴 소득
  residence_status:
    owner: 자가
    jeonse: 전세
    wolse: 월세
    family_home: 가족과 거주
    other: 기타 주거
  mortgage_status:
    none: 담보대출 없음
    active: 담보대출 상환 중
    closed: 담보대출 종료
  self_education_status:
    none: 교육 과정 없음
    enrolled: 교육 과정 등록
    study_abroad: 유학 중
  child_education_stage:
    preschool: 취학 전
    primary: 초등학교
    middle: 중학교
    high: 고등학교
    adult: 성인
  pension_or_irp:
    __none__: 연금·IRP 없음
    irp: IRP 보유
    receiving: 연금 수령 중
  child_education_goal:
    __none__: 교육 목표 없음
    active: 교육 목표 활성
  expense_category:
    medical: 의료비
    accident_or_disaster: 사고·재난 비용
    fraud_loss: 금융사기 피해액
    funeral: 장례비
  property_role:
    primary_residence: 실거주 주택
    secondary_property: 비실거주 보유 주택
  property_ownership_status:
    owned: 보유 중
    sold: 매각 완료

paths:
  household.marital_status:
    label_ko: 혼인 상태
    question_ko: "{date} 기준, 혼인 상태는 무엇인가?"
    answer_type: mcq
    choice_set: marital_status

  household.spouse_or_partner:
    label_ko: 배우자·파트너
    enabled: false
    question_ko: "{date} 기준, 메모리에 등록된 배우자 또는 파트너 정보는 무엇인가?"
    answer_type: free_response
    normalizer: text
    answer_aliases:
      배우자: spouse
      배우자 등록: spouse

  household.child_support_arrangement:
    label_ko: 양육비
    question_ko: "{date} 기준, 등록된 월 양육비는 얼마인가?"
    answer_type: free_response
    normalizer: krw

  household.children:
    label_ko: 자녀 정보
    selectors:
      count:
        label_ko: 자녀 수
        selector_type: list_count
        question_ko: "{date} 기준, 자녀는 몇 명인가?"
        answer_type: free_response
        normalizer: integer
      ages:
        label_ko: 자녀 나이
        enabled: false
        selector_type: list_values
        question_ko: "{date} 기준, 자녀들의 나이를 모두 답하시오."
        answer_type: free_response
        normalizer: integer_list

  household.dependents:
    label_ko: 부양가족 수
    question_ko: "{date} 기준, 부양가족은 몇 명인가?"
    answer_type: free_response
    normalizer: integer

  employment.employment_status:
    label_ko: 고용 상태
    question_ko: "{date} 기준, 고용 상태는 무엇인가?"
    answer_type: mcq
    choice_set: employment_status

  employment.employer:
    label_ko: 직장
    question_ko: "{date} 기준, 등록된 직장은 어디인가?"
    answer_type: free_response
    normalizer: text

  employment.income_stability:
    label_ko: 소득 안정성
    question_ko: "{date} 기준, 소득 안정성은 어떻게 기록되어 있는가?"
    answer_type: mcq
    choice_set: income_stability

  employment.salary_day:
    label_ko: 급여일
    question_ko: "{date} 기준, 등록된 급여일은 며칠인가?"
    answer_type: mcq
    choices:
      "10": 10일
      "15": 15일
      "21": 21일
      "25": 25일

  employment.salary_account:
    label_ko: 급여계좌
    enabled: false
    question_ko: "{date} 기준, 등록된 급여계좌는 무엇인가?"
    answer_type: free_response
    normalizer: text
    answer_aliases:
      현재 사용 중인 입출금계좌: main_checking
      지금 쓰는 입출금 계좌: main_checking
      주거래 입출금계좌: main_checking
      주거래 계좌: main_checking
      급여계좌: main_checking

  housing.residence_status:
    label_ko: 주거 상태
    question_ko: "{date} 기준, 주거 상태는 무엇인가?"
    answer_type: mcq
    choice_set: residence_status

  housing.address:
    label_ko: 거주지
    question_ko: "{date} 기준, 등록된 거주지는 어디인가?"
    answer_type: free_response
    normalizer: text

  housing.contract_type:
    label_ko: 주거 계약 유형
    enabled: false
    question_ko: "{date} 기준, 주거 계약 유형은 무엇인가?"
    answer_type: mcq
    choice_set: residence_status

  housing.rent_amount:
    label_ko: 월세
    question_ko: "{date} 기준, 등록된 월세 금액은 얼마인가?"
    answer_type: free_response
    normalizer: krw

  housing.rent_payee:
    label_ko: 월세 수취인
    enabled: false
    question_ko: "{date} 기준, 월세 수취인으로 등록된 대상은 누구인가?"
    answer_type: free_response
    normalizer: text

  housing.maintenance_fee_payee:
    label_ko: 관리비 납부처
    enabled: false
    question_ko: "{date} 기준, 관리비 납부처는 어디인가?"
    answer_type: free_response
    normalizer: text

  housing.mortgage_status:
    label_ko: 주택담보대출 상태
    question_ko: "{date} 기준, 주택담보대출 상태는 무엇인가?"
    answer_type: mcq
    choice_set: mortgage_status

  housing.properties:
    label_ko: 보유 주택
    entity_param_candidates: [property_id, sold_property_id]
    selectors:
      owned_count:
        label_ko: 보유 주택 수
        selector_type: owned_property_count
        scope: collection
        question_ko: "{date} 기준, 현재 보유 중인 주택은 몇 채인가?"
        answer_type: free_response
        normalizer: integer
      address:
        label_ko: 주택 주소
        selector_type: property_field
        field: address
        scope: event_entity
        question_ko: "{date} 기준, {anchor_date} 상담에서 변동 대상으로 언급된 {entity_role_ko}의 주소는 어디인가?"
        answer_type: free_response
        normalizer: text
      role:
        label_ko: 주택 용도
        enabled: false
        selector_type: property_field
        field: role
        scope: event_entity
        question_ko: "{date} 기준, {entity_address} 주택의 용도는 무엇인가?"
        answer_type: mcq
        choice_set: property_role
      mortgage_status:
        label_ko: 개별 주택 담보대출 상태
        enabled: false
        selector_type: property_field
        field: mortgage_status
        scope: event_entity
        question_ko: "{date} 기준, {entity_address} 주택에 기록된 담보대출 상태는 무엇인가?"
        answer_type: mcq
        choice_set: mortgage_status
      ownership_status:
        label_ko: 개별 주택 소유 상태
        selector_type: property_field
        field: ownership_status
        scope: event_entity
        question_ko: "{date} 기준, {entity_address} 주택의 소유 상태는 무엇인가?"
        answer_type: mcq
        choice_set: property_ownership_status

  housing.primary_residence_property_id:
    label_ko: 실거주 주택
    selectors:
      address:
        label_ko: 실거주 주택 주소
        selector_type: primary_residence_address
        question_ko: "{date} 기준, 현재 보유 중인 주택 가운데 실거주 주택이 있다면 그 주소를, 없다면 '없음'을 답하시오."
        answer_type: free_response
        normalizer: text

  education.self_education_status:
    label_ko: 본인 교육 상태
    question_ko: "{date} 기준, 본인의 교육 상태는 무엇인가?"
    answer_type: mcq
    choice_set: self_education_status

  education.child_education_stage:
    label_ko: 자녀 교육 단계
    question_ko: "{date} 기준, 기록된 자녀 교육 단계는 무엇인가?"
    answer_type: mcq
    choice_set: child_education_stage
    value_aliases:
      pre_school: preschool

  financial_products.loans:
    label_ko: 대출 정보
    selectors:
      count:
        label_ko: 대출 수
        enabled: false
        selector_type: list_count
        question_ko: "{date} 기준, 등록된 대출은 몇 건인가?"
        answer_type: free_response
        normalizer: integer
      types:
        label_ko: 대출 유형
        enabled: false
        selector_type: list_values
        question_ko: "{date} 기준, 등록된 대출 유형을 모두 답하시오."
        answer_type: free_response
        normalizer: string_list
        answer_aliases:
          담보대출: mortgage
          주택담보대출: mortgage
          주담대: mortgage

  financial_products.pension_or_irp:
    label_ko: 연금·IRP 상태
    enabled: false
    question_ko: "{date} 기준, 연금·IRP 상태는 무엇인가?"
    answer_type: mcq
    choice_set: pension_or_irp

  goals.child_education_goal:
    label_ko: 자녀 교육 목표
    enabled: false
    question_ko: "{date} 기준, 자녀 교육 목표의 상태는 무엇인가?"
    answer_type: mcq
    choice_set: child_education_goal

  cashflow.recent_one_off_expense:
    label_ko: 최근 일회성 지출
    selectors:
      category:
        label_ko: 최근 일회성 지출 유형
        enabled: false
        selector_type: dict_key
        key: category
        question_ko: "{date} 기준, 가장 최근 일회성 지출의 유형은 무엇인가?"
        answer_type: mcq
        choice_set: expense_category
      amount_krw:
        label_ko: 최근 일회성 지출 금액
        selector_type: dict_key
        key: amount_krw
        question_ko: "{date} 기준, 가장 최근 일회성 지출 금액은 얼마인가?"
        answer_type: free_response
        normalizer: krw
