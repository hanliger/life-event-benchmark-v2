# Stage 2 uses one representative value per occurred event instance.
# Every target is rendered as a four-option multiple-choice question.
# An option_pool with exactly four values is authoritative and fixed.
# Larger pools are candidate values from which four options are selected.

career_employment:
  target_memory_path: employment.employer
  question_label: 현재 직장
  option_pool_type: entity
  option_pool: [미래정보시스템, 신영유통, 두레헬스케어, 한빛물류, 청람교육, 서연식품, 온새미로디자인, 대성엔지니어링]

career_employment_end:
  target_memory_path: employment.employment_status
  question_label: 고용 상태
