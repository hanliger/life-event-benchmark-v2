# Stage 3 Multi-hop question policy.
#
# Candidate facts must be occurred, dialogue-grounded PrefixGold updates.
# Two facts on the same canonical memory path are paired chronologically.
# max_candidates is an upper cap after semantic validation; selection remains
# deterministic for a fixed seed.
#
# Representative mode keeps one meaningful pair for each trajectory and
# question axis. It prefers adjacent updates with a real value change.
# children and dependents overlap, so dependents is the representative axis.
representative_selection:
  group_by: trajectory_memory_path
  omit_unchanged_sequences: true
  redundant_paths:
    household.children: household.dependents

paths:
  employment.employment_status:
    derivation_type: state_sequence
    question_label: 고용 상태
    value_selector: value
    option_pool_type: categorical
    option_pool: [employed, on_leave, self_employed, unemployed, retired]
    allow_same_value: false
    allow_null: false
    max_candidates: 165

  employment.employer:
    derivation_type: state_sequence
    question_label: 직장
    value_selector: value
    option_pool_type: entity
    allow_same_value: false
    allow_null: false
    max_candidates: 49

  employment.income_stability:
    derivation_type: state_sequence
    question_label: 소득 안정성
    value_selector: value
    option_pool_type: categorical
    option_pool: [stable, variable, reduced, unstable]
    excluded_values: [retired]
    allow_same_value: true
    allow_null: false
    max_candidates: 177

  employment.salary_day:
    derivation_type: state_sequence
    question_label: 급여일
    value_selector: value
    option_pool_type: numeric
    option_pool: [10, 15, 21, 25]
    allow_same_value: false
    allow_null: false
    max_candidates: 55

  housing.address:
    derivation_type: state_sequence
    question_label: 거주지
    value_selector: value
    option_pool_type: entity
    allow_same_value: false
    allow_null: false
    max_candidates: 92

  housing.contract_type:
    derivation_type: state_sequence
    question_label: 주거 유형
    value_selector: value
    option_pool_type: categorical
    option_pool: [owner, jeonse, wolse, family_home, other]
    allow_same_value: false
    allow_null: false
    max_candidates: 74

  housing.rent_amount:
    derivation_type: amount_comparison
    question_label: 월세 금액
    value_selector: value
    option_pool_type: numeric
    option_pool: [0, 400000, 500000, 650000, 800000, 1000000]
    allow_same_value: false
    allow_null: true
    max_candidates: 32

  household.dependents:
    derivation_type: count_sequence
    question_label: 부양가족 수
    value_selector: value
    option_pool_type: count
    option_pool: [0, 1, 2, 3, 4]
    allow_same_value: true
    allow_null: false
    max_candidates: 75

  household.children:
    derivation_type: count_sequence
    question_label: 자녀 수
    value_selector: list_count
    option_pool_type: count
    option_pool: [0, 1, 2, 3, 4]
    allow_same_value: false
    allow_null: false
    max_candidates: 14

  household.marital_status:
    derivation_type: state_sequence
    question_label: 혼인 상태
    value_selector: value
    option_pool_type: categorical
    option_pool: [single, married, separated, divorced, widowed]
    allow_same_value: true
    allow_null: false
    max_candidates: 5

  cashflow.recent_one_off_expense:
    derivation_type: expense_aggregation
    question_label: 일회성 지출 합계
    value_selector: amount_krw
    option_pool_type: numeric
    allow_same_value: true
    allow_null: false
    max_candidates: 109

excluded_paths:
  # Child identity and stage progression are not reliable enough in the
  # frozen trajectories to support compositional questions.
  - education.child_education_stage
  # The frozen corpus cannot reliably prove that two property updates refer
  # to the same asset, and sale sessions often restate the prior ownership.
  - housing.properties
  - housing.mortgage_status
