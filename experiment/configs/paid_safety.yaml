schema_version: paid-safety-v1
smoke:
  # Per-plan ceiling. The stricter cumulative standing limit is enforced by
  # configs/paid_cost_ledger.json and must remain strictly below $20.00.
  usd_cap: 7.5
  # Nine Stage 2.2 methods may be scheduled together. Independent checkpoints
  # use isolated prefixes or immutable snapshot clones.
  concurrency: 9
  checkpoint_concurrency: 20
  max_in_flight: 60
  anthropic_max_in_flight: 20
  openrouter_max_in_flight: 40
  automatic_retries: 0
  parse_retries: 1
  stop_on_first_error: true
full:
  usd_cap: null
  concurrency: 1
  automatic_retries: 0
  stop_on_first_error: true
limits:
  letta_max_steps: 5
  letta_search_calls_per_query: 4
  timeout_is_unknown_billing_state: true
  unknown_billing_state_auto_resume: false
approval:
  require_execute_paid_flag: true
  require_exact_plan_sha: true
  load_dotenv_only_after_approval: true
