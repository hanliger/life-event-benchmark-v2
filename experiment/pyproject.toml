[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-memory-experiment"
version = "0.1.0"
description = "Isolated evaluation harness for the financial life-event memory benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.5,<3",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "tqdm>=4.65,<5",
  "huggingface-hub>=0.23,<2",
  "python-dotenv>=1,<2",
  "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
bm25 = ["kiwipiepy>=0.20,<1"]
dense = ["google-genai>=2,<3"]
mem0 = ["mem0ai==2.0.12", "qdrant-client>=1.12,<2", "google-genai>=2,<3"]
letta = ["letta-client==1.12.1", "google-genai>=2,<3"]
paid = ["openai>=1.100,<3", "anthropic>=0.60,<2", "google-genai>=2,<3"]
all = [
  "pytest>=8,<10",
  "kiwipiepy>=0.20,<1",
  "google-genai>=2,<3",
  "mem0ai==2.0.12",
  "qdrant-client>=1.12,<2",
  "letta-client==1.12.1",
  "openai>=1.100,<3",
  "anthropic>=0.60,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
